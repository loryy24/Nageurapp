<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Nageur Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
           background-image: url('/static/images/nageur.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            color: white;
        }
        .card {
            background-color:  rgba(198, 192, 192, 0.75);
            border-radius: 1rem;
        }
        .form-control::placeholder {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center h-100">
        <div class="col-md-6">
            <div class="card p-4">
                <h2 class="text-center mb-4">Créer un compte</h2>
                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label for="email" class="form-label">Adresse Email</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="email@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Mot de passe" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmer le mot de passe</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirmez" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                    <div class="mt-3 text-center">
                        <small>Déjà inscrit ? <a href="/login" class="text-info">Se connecter</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
