{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Simulateur de Matchs</h2>
        <button class="btn btn-primary" onclick="simulateMatch()">Simuler</button>
    </div>

    <form method="POST" action="/ajouter_match">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="text" class="form-control" name="joueur1" placeholder="Joueur 1" required>
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" name="joueur2" placeholder="Joueur 2" required>
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" name="coach" placeholder="Coach responsable">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-success w-100">Ajouter le match</button>
            </div>
        </div>
    </form>

    <hr class="my-4">

    <div class="row" id="match-cards">
        {% for match in matchs %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ match.joueur1 }} vs {{ match.joueur2 }}</h5>
                    <p class="card-text">Score : <strong>{{ match.score }}</strong></p>
                    <p class="text-muted">Coach : {{ match.coach }}</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="text-muted small">Le {{ match.date }}</span>
                        <i class="fas fa-battery-full text-success fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function simulateMatch() {
        fetch('/simuler', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            location.reload();
        });
    }
</script>
{% endblock %}
