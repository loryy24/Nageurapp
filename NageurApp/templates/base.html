<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (icônes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body {
            overflow-x: hidden;
        }
        #sidebar {
            min-height: 100vh;
            transition: all 0.3s;
        }
        #sidebar.collapsed {
            width: 80px;
        }
        #sidebar .nav-link span {
            transition: opacity 0.2s;
        }
        #sidebar.collapsed .nav-link span {
            opacity: 0;
        }
        #main-content {
            transition: margin-left 0.3s;
            margin-left: 250px;
        }
        #main-content.collapsed {
            margin-left: 80px;
        }
        .sidebar-toggle {
            cursor: pointer;
        }
        /* ✅ Correction ici : on cible #sidebar.collapsed */
        #sidebar.collapsed .sidebar-title {
            display: none;
        }
        .sidebar-title {
            transition: opacity 0.3s, transform 0.3s;
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="bg-dark text-white p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0 sidebar-title">
                <i class="fas fa-chart-line me-2"></i><span>MENU</span>
            </h5>
            <i class="fas fa-bars sidebar-toggle" onclick="toggleSidebar()"></i>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link text-white" href="/">
                    <i class="fas fa-home me-2"></i><span>Accueil</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/dashboard">
                    <i class="fas fa-gauge me-2"></i><span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/historique">
                    <i class="fas fa-clock-rotate-left me-2"></i><span>Historique</span>
                </a>
            </li>
             <li>
            <a href="/logout" class="btn btn-danger">Se déconnecter</a>
             </li>
        </ul>
    </nav>
    
    <!-- Main Content -->
    <div id="main-content" class="flex-grow-1 p-4">
        {% block content %}
        {% endblock %}
    </div>
</div>

<!-- Scripts -->
<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
        document.getElementById("main-content").classList.toggle("collapsed");
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
